name: Manter o banco acordado

# O Supabase grátis pausa o projeto depois de 7 dias sem uso.
# Este é um segundo despertador, independente do cron da Vercel:
# todo dia ele consulta o banco e, se não responder, o GitHub manda um e-mail avisando.
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 (Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o Supabase
        env:
          SUPABASE_URL: https://cmqltjsaivvlfgthikrp.supabase.co
          SUPABASE_KEY: sb_publishable_QnFFlvFmJfQv1CxXRpqzXw_yT-QE_rL   # chave pública (a mesma de js/config.js)
        run: |
          ping=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d "{}" || true)
          tabela=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" || true)
          echo "ping: $ping · tabela: $tabela"
          if [ "$ping" != "200" ] || [ "$tabela" != "200" ]; then
            echo "::error::O banco não respondeu. Se o projeto foi pausado, reative em https://supabase.com/dashboard (Restore project)."
            exit 1
          fi

      - name: Acordar também pelo site (cron da Vercel)
        run: curl -s --max-time 30 https://motorcycle-mom.vercel.app/api/keepalive || true
